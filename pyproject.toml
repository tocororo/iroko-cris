[project]
name = "iroko"
version = "0.1.0"
description = ""
authors = [
    {name = "Rafael Martinez Estevez",email = "malayibiri@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    "neo4j (>=5.28.1,<6.0.0)",
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "pydantic (>=2.11.3,<3.0.0)",
    "cruft (>=2.16.0,<3.0.0)",
    # New dependencies for auth
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "asyncpg (>=0.29.0,<0.30.0)",
    "alembic (>=1.13.0,<2.0.0)",
    "python-jose (>=3.3.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (>=4.0.0,<5.0.0)",
    "python-multipart (>=0.0.6,<0.0.7)",
    "authlib (>=1.2.0,<2.0.0)",
    "jinja2 (>=3.1.0,<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "python-json-logger (>=4.0.0,<5.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
]


[tool.poetry]
name = "iroko"
version = "0.1.0"
description = ""
authors = ["Rafael Martinez Estevez <malayibiri@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "iroko" }]  

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
hd2neo4j = {path = "/home/malayo/dev/hd2neo4j", develop = true}
flet = {extras = ["all"], version = "0.27.2"}
linkml = "^1.9.2"
loguru = "^0.7.3"
sentry-sdk = "^2.38.0"
flet-model = "^0.1.5"
zxcvbn = "^4.5.0"
httpx = "^0.28.1"