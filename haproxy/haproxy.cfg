global
  log stdout format raw local0
  maxconn 4000
  stats socket /var/run/haproxy.sock mode 660 level admin expose-fd listeners

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 50s
  timeout server 50s
  timeout http-request 10s

frontend http-in
  bind *:80
  use_backend api if { path_beg /api }
  default_backend api

backend api
  # Rewrite path to maintain /api prefix for FastAPI
  http-request set-header X-Forwarded-Prefix /api
  server api1 api:8000 check
