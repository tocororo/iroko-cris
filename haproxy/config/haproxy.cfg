# haproxy/haproxy.cfg
global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    option forwardfor
    option http-server-close

frontend http_front
    bind *:8080
    # bind *:8443 ssl crt /etc/ssl/private/iroko.pem

    # Redirect HTTP to HTTPS
    # http-request redirect scheme https code 301 if !{ ssl_fc }

    # API routing
    acl is_api path_beg /api
    use_backend api_servers if is_api

    # Frontend routing
    default_backend frontend_servers

backend api_servers
    balance roundrobin
    option httpchk GET /api/health
    http-check send hdr Host sceiba.mes.gob.cu
    server api1 api:8000 check port 8000 inter 10s fall 4 rise 2

    # Security headers
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

backend frontend_servers
    balance roundrobin
    server frontend1 ui:80 check inter 10s fall 4 rise 2

    # Security headers
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
