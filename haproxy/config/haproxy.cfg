# haproxy/haproxy.cfg
global
    daemon
    maxconn 256

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    option forwardfor
    option http-server-close

frontend http_front
    bind *:80
    bind *:443 ssl crt /etc/ssl/private/iroko.pem
    
    # Redirect HTTP to HTTPS
    redirect scheme https code 301 if !{ ssl_fc }
    
    # CORS headers for all responses
    http-response set-header Access-Control-Allow-Origin "*" if { var(txn.cors) -m bool }
    http-response set-header Access-Control-Allow-Credentials "true" if { var(txn.cors) -m bool }
    http-response set-header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,PATCH" if { var(txn.cors) -m bool }
    http-response set-header Access-Control-Allow-Headers "Authorization,Content-Type,Accept,Origin,X-Requested-With,X-CSRF-Token" if { var(txn.cors) -m bool }
    http-response set-header Access-Control-Expose-Headers "Content-Range,X-Content-Range,X-Total-Count" if { var(txn.cors) -m bool }
    http-response set-header Access-Control-Max-Age "600" if { var(txn.cors) -m bool }
    
    # Set CORS flag for API routes
    acl is_api path_beg /api
    http-request set-var(txn.cors) bool(true) if is_api
    
    # API routing
    acl is_api path_beg /api
    use_backend api_servers if is_api
    
    # Frontend routing
    default_backend frontend_servers

backend api_servers
    balance roundrobin
    option httpchk httpchk GET /api/health
    server api1 api:8000 check inter 10s fall 4 rise 2
    
    # Add headers for API responses
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

backend frontend_servers
    balance roundrobin
    server frontend1 frontend:80 check inter 10s fall 4 rise 2
    
    # Add security headers for frontend
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"