version: '3.8'

services:

  postgres:
    image: quay.io/lib/postgres:16-alpine
    container_name: iroko-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./initdb:/docker-entrypoint-initdb.d:Z
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-iroko}
      - POSTGRES_USER=${POSTGRES_USER:-iroko_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-iroko_password}
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iroko_user} -d ${POSTGRES_DB:-iroko}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iroko-net
    restart: unless-stopped

  memgraph:
    image: docker.uclv.cu/memgraph/memgraph-mage:latest
    container_name: iroko-memgraph-mage
    ports:
      - "7688:7687" 
      - "7444:7444"
    command: ["--log-level=TRACE"]
    volumes:
      - mg_lib:/var/lib/memgraph:Z
      - mg_log:/var/log/memgraph:Z
    environment:
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=memgraph
    networks:
      - iroko-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mgconsole", "--username", "memgraph", "--password", "memgraph", "--query", "RETURN 1;"]
      interval: 10s
      timeout: 5s
      retries: 10
  lab:
    image: docker.uclv.cu/memgraph/lab:latest
    container_name: iroko-memgraph-lab
    ports:
      - "3000:3000"
    depends_on:
      - memgraph
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      - QUICK_CONNECT_MG_PORT=7687
      - QUICK_CONNECT_USERNAME=memgraph
      - QUICK_CONNECT_PASSWORD=memgraph
    networks:
      - iroko-net
    restart: unless-stopped


volumes:
  postgres_data:
    driver: local
  mg_lib:
    driver: local
  mg_log:
    driver: local
networks:
  iroko-net:
    driver: bridge
    attachable: true
    labels:
      - description="Isolated network for iroko-cris services"