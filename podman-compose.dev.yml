version: '3.8'

services:
  neo4j:
    image: quay.io/lib/neo4j:latest
    container_name: iroko-neo4j
    hostname: neo4j
    ports:
      - "7474:7474"  # Browser interface
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data:Z
      - neo4j_logs:/logs:Z
      - neo4j_plugins:/plugins:Z
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_dbms_default__database=${NEO4J_DATABASE}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iroko-net
    restart: unless-stopped

  postgres:
    image: quay.io/lib/postgres:16-alpine
    container_name: iroko-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./initdb:/docker-entrypoint-initdb.d:Z
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-iroko_auth}
      - POSTGRES_USER=${POSTGRES_USER:-iroko_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-iroko_password}
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iroko_user} -d ${POSTGRES_DB:-iroko_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iroko-net
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_plugins:
    driver: local
  postgres_data:
    driver: local
    
networks:
  iroko-net:
    driver: bridge
    attachable: true
    labels:
      - description="Isolated network for iroko-cris services"