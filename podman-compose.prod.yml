version: '3.8'

services:

  postgres:
    image: docker.uclv.cu/postgres:16-alpine
    hostname: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./initdb:/docker-entrypoint-initdb.d:Z
    networks:
      - iroko-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  memgraph:
    image: docker.uclv.cu/memgraph/memgraph-mage:latest
    hostname: memgraph
    command: ["--log-level=TRACE"]
    environment:
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-memgraph}
    volumes:
      - mg_lib:/var/lib/memgraph:Z
      - mg_log:/var/log/memgraph:Z
    networks:
      - iroko-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mgconsole", "--username", "memgraph", "--password", "${MEMGRAPH_PASSWORD:-memgraph}", "--query", "RETURN 1;"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_ENV=production
    image: iroko/api:prod
    hostname: api
    environment:
      - APP_ENV=production
      - BASE_PATH=/api
      - NEO4J_URI=bolt://memgraph:7687
      - NEO4J_USERNAME=memgraph
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - memgraph
      - postgres
    networks:
      - iroko-net
    restart: unless-stopped
    security_opt:
      - label=disable
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid

  frontend:
    build:
      context: ./iroko-ui  # Adjust path to your frontend repository
      dockerfile: Dockerfile
    image: iroko/frontend:prod
    hostname: frontend
    networks:
      - iroko-net
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    depends_on:
      - api

  haproxy:
    image: docker.uclv.cu/haproxy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./haproxy:/usr/local/etc/haproxy:ro,Z
      - ./ssl:/etc/ssl/private:ro,Z
    depends_on:
      - api
      - frontend
    networks:
      - iroko-net
    restart: unless-stopped

volumes:
  mg_lib:
    driver: local
  mg_log:
    driver: local
  postgres_data:
    driver: local

networks:
  iroko-net:
    driver: bridge